name: Deploy MasalNova to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Videoliste aktualisieren & alle 6h neu deployen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Refresh video list from YouTube
        run: node scripts/build-videos.mjs || echo "Video-Refresh fehlgeschlagen — committete videos.json wird verwendet"
      - name: Build site
        env:
          # Google Privacy & messaging is published and Auto ads are disabled.
          # Load the publisher tag for CMP/review, but keep all ad units off.
          PUBLIC_ADSENSE_TAG_ENABLED: 'true'
          PUBLIC_GOOGLE_CMP_PUBLISHED: 'true'
          PUBLIC_ADSENSE_ENABLED: 'false'
          PUBLIC_ADSENSE_MANUAL_ONLY: 'true'
        # The first pass discovers every cover used by the rotating homepage,
        # then Sharp creates the responsive WebP variants and the second pass
        # emits markup that points at those generated files.
        run: npm run build:optimized && npm run audit:publishing -- --built
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
