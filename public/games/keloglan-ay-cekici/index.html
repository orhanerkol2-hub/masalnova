<body>

      let level=null,particles=[],fireflies=[];

      const levelBlueprints = [

      function readNumber(key,fallback) {
        try { const value=Number(localStorage.getItem(key)); return Number.isFinite(value)?value:fallback; }
        catch { return fallback; }
      }
      function storeNumber(key,value) { try { localStorage.setItem(key,String(value)); } catch {} }
      function clamp(value,min,max) { return Math.max(min,Math.min(max,value)); }
      function overlap(a,b) { return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
      function roundedRect(context,x,y,w,h,r) {
        const radius=Math.min(r,w/2,h/2);
        context.beginPath();
        context.moveTo(x+radius,y);
        context.arcTo(x+w,y,x+w,y+h,radius);
        context.arcTo(x+w,y+h,x,y+h,radius);
        context.arcTo(x,y+h,x,y,radius);
        context.arcTo(x,y,x+w,y,radius);
        context.closePath();
      }
      function fit() {
        const rect=stage.getBoundingClientRect();
        cssWidth=Math.max(320,rect.width);

        dpr=Math.min(window.devicePixelRatio||1,2);

      function ensureAudio() {

      function update(dt) {

        player.coyote=Math.max(0,player.coyote-dt);
        player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
        const direction=(input.right?1:0)-(input.left?1:0);
        if(direction) player.facing=direction;
        const target=direction*265;
        player.vx+=(target-player.vx)*Math.min(1,dt*(direction?12:9));
        player.x+=player.vx*dt;
        player.x=clamp(player.x,0,level.width-player.w);
        const previousBottom=player.y+player.h;
        const sideBox={x:player.x,y:player.y+8,w:player.w,h:player.h-8};
        level.breakables.filter(b=>!b.broken).concat(level.obstacles).forEach(block=>{
          if(!overlap(sideBox,block)) return;
          if(player.vy>=0&&previousBottom<=block.y+9) return;

          else if(player.vx<0) player.x=block.x+block.w;
          player.vx=0;

            const nextBottom=player.y+player.h;
            const horizontal=player.x+player.w>surface.x+5&&player.x<surface.x+surface.w-5;

        level.checkpoints.forEach(x=>{if(player.x>=x&&x>checkpointX){checkpointX=x;showToast('GÜVENLİ NOKTA','#2b7d72');tone(590,.08,'triangle');}});

          if(moon.taken) return;

        });

        } else if(type==='hay') {
          ctx.fillStyle='#d79a32';roundedRect(ctx,2,8,w-4,h-9,12);ctx.fill();ctx.strokeStyle='#f3c75d';ctx.lineWidth=4;
          for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(8,17+i*11);ctx.lineTo(w-8,13+i*12);ctx.stroke();}
          ctx.strokeStyle='#9c6928';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w*.35,9);ctx.lineTo(w*.38,h-2);ctx.moveTo(w*.68,8);ctx.lineTo(w*.66,h-2);ctx.stroke();
        } else if(type==='cart') {
          ctx.fillStyle='#d5a241';ctx.beginPath();ctx.ellipse(52,23,42,20,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f5d66c';ctx.lineWidth=3;
          for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(18+i*15,11);ctx.lineTo(28+i*13,35);ctx.stroke();}
          ctx.fillStyle='#80502e';roundedRect(ctx,8,30,79,22,5);ctx.fill();ctx.fillStyle='#bb7440';ctx.fillRect(14,35,67,6);
          ctx.strokeStyle='#633d2b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(83,43);ctx.lineTo(106,54);ctx.stroke();
          for(const wheelX of [24,73]){ctx.fillStyle='#4b3540';ctx.beginPath();ctx.arc(wheelX,55,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d09a57';ctx.lineWidth=4;ctx.stroke();}
        } else if(type==='mushroom') {
          ctx.fillStyle='#f3d6a8';roundedRect(ctx,26,25,22,h-25,10);ctx.fill();ctx.fillStyle='#7f4da1';ctx.beginPath();ctx.ellipse(w/2,25,w*.48,25,0,Math.PI,Math.PI*2);ctx.fill();
          ctx.fillStyle='#ffd56a';for(const p of [[20,17,5],[38,9,6],[53,20,4]]){ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();}
        } else if(type==='pumpkin') {
          ctx.fillStyle='#d66d2b';ctx.beginPath();ctx.ellipse(w/2,34,33,24,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f5a13c';ctx.lineWidth=4;
          for(const dx of [-17,0,17]){ctx.beginPath();ctx.ellipse(w/2+dx,34,12,23,0,Math.PI*.55,Math.PI*1.45);ctx.stroke();}
          ctx.fillStyle='#4f7b42';roundedRect(ctx,w/2-4,3,8,12,3);ctx.fill();ctx.beginPath();ctx.arc(w/2+8,8,11,2.6,5.8);ctx.strokeStyle='#4f7b42';ctx.lineWidth=3;ctx.stroke();
        } else {
          ctx.strokeStyle='#8c5a32';ctx.lineWidth=5;ctx.beginPath();ctx.arc(w/2,18,23,Math.PI,0);ctx.stroke();
          ctx.fillStyle='#b8793e';roundedRect(ctx,3,17,w-6,h-18,8);ctx.fill();ctx.strokeStyle='#e0a764';ctx.lineWidth=2;
          for(let yy=25;yy<h;yy+=9){ctx.beginPath();ctx.moveTo(7,yy);ctx.lineTo(w-7,yy);ctx.stroke();}
          for(let xx=13;xx<w;xx+=13){ctx.beginPath();ctx.moveTo(xx,19);ctx.lineTo(xx-4,h-3);ctx.stroke();}
        }
        ctx.restore();
      }
      function drawMoon(moon,time) {
        if(moon.taken) return;
        const bob=Math.sin(time*.004+moon.phase)*6;
        ctx.save();ctx.translate(moon.x,moon.y+bob);ctx.rotate(Math.sin(time*.002+moon.phase)*.08);
        ctx.shadowColor='#ffe06b';ctx.shadowBlur=20;ctx.fillStyle='#ffd33e';
        ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.arc(8,-4,16,0,Math.PI*2,true);ctx.fill('evenodd');
        ctx.restore();
      }
      function drawRune(rune,time) {
        ctx.save();ctx.translate(rune.x,rune.y);
        ctx.shadowColor=rune.repaired?'#ffe47a':'#68dff5';ctx.shadowBlur=18;
        ctx.fillStyle=rune.repaired?'#ffd45d':'#42bed5';
        ctx.beginPath();ctx.arc(0,0,22+Math.sin(time*.005)*2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#17326c';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(rune.repaired?'✓':'⌁',0,1);
        ctx.restore();
      }
      function drawShadow(shadow,time) {
        if(shadow.transformed) return;
        ctx.save();ctx.translate(shadow.x+shadow.w/2,shadow.y+shadow.h/2+Math.sin(time*.004+shadow.phase)*3);
        ctx.shadowColor='#8b5de5';ctx.shadowBlur=16;ctx.fillStyle='#37225d';
        ctx.beginPath();ctx.arc(0,2,25,0,Math.PI*2);ctx.quadraticCurveTo(18,-38,2,-27);ctx.quadraticCurveTo(-14,-38,-13,-20);ctx.fill();
        ctx.fillStyle='#ffe763';ctx.beginPath();ctx.arc(-8,-2,4,0,Math.PI*2);ctx.arc(8,-2,4,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#eac6ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,7,8,.15,Math.PI-.15);ctx.stroke();
        ctx.restore();
      }
      function drawGate(gate,time) {
        const open=level.collected===5;
        ctx.save();ctx.translate(gate.x,gate.y);
        ctx.shadowColor=open?'#ffe16c':'#7050af';ctx.shadowBlur=open?28:10;
        ctx.fillStyle=open?'#f6c94e':'#4f4478';
        roundedRect(ctx,0,0,gate.w,gate.h,gate.w/2);ctx.fill();
        ctx.fillStyle=open?'#173b86':'#211d4e';
        roundedRect(ctx,10,13,gate.w-20,gate.h-13,gate.w/2-10);ctx.fill();
        ctx.fillStyle=open?'#fff4a4':'#8071ad';ctx.font='bold 33px system-ui';ctx.textAlign='center';ctx.fillText(open?'★':'☾',gate.w/2,70+Math.sin(time*.004)*3);
        ctx.restore();
      }
      function drawPlayer(time) {
        const flicker=player.invincible>0&&Math.floor(player.invincible*12)%2===0;
        ctx.save();
        ctx.globalAlpha=flicker?.38:1;
        const bob=player.grounded&&Math.abs(player.vx)>30?Math.sin(time*.014)*3:0;
        const drawW=70,drawH=88;
        ctx.translate(player.x+player.w/2,player.y+player.h/2+bob);
        ctx.scale(player.facing,1);
        if(images.player?.complete&&images.player.naturalWidth) {
          ctx.shadowColor='rgba(16,20,42,.28)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;
          ctx.drawImage(images.player,-drawW/2,-drawH/2,drawW,drawH);
        } else {
          ctx.fillStyle='#1a62a2';roundedRect(ctx,-22,-4,44,42,12);ctx.fill();
          ctx.fillStyle='#f0a05d';ctx.beginPath();ctx.arc(0,-24,23,0,Math.PI*2);ctx.fill();
        }
        if(player.hammerTime>0) {
          const progress=1-player.hammerTime/.25;
          ctx.rotate(-1.15+progress*1.85);
          ctx.shadowColor='#ffe36c';ctx.shadowBlur=18;
          ctx.fillStyle='#7a4825';roundedRect(ctx,18,-8,42,9,4);ctx.fill();
          ctx.fillStyle='#e5a844';roundedRect(ctx,50,-20,31,31,8);ctx.fill();
          ctx.fillStyle='#fff0a4';ctx.beginPath();ctx.arc(66,-4,7,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
      function draw(time) {
        drawBackground(time);
        ctx.save();
        ctx.setTransform(dpr*renderScale,0,0,dpr*renderScale,-cameraX*dpr*renderScale,0);
        level.floors.forEach(drawPlatform);
        level.platforms.forEach(drawPlatform);
        level.bridgePlatforms.filter(p=>p.active).forEach(drawPlatform);
        level.obstacles.forEach(o=>drawObstacle(o,time));
        level.breakables.forEach(drawBreakable);
        level.runes.forEach(r=>drawRune(r,time));
        level.moons.forEach(m=>drawMoon(m,time));
        level.shadows.forEach(s=>drawShadow(s,time));
        drawGate(level.gate,time);
        fireflies.forEach(f=>{
          ctx.save();ctx.globalAlpha=clamp(f.life,0,1);ctx.fillStyle='#ffe76e';ctx.shadowColor='#ffe76e';ctx.shadowBlur=16;
          ctx.beginPath();ctx.arc(f.x+Math.sin(f.phase)*18,f.y,5,0,Math.PI*2);ctx.fill();ctx.restore();
        });
        particles.forEach(p=>{
          ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
        });
        drawPlayer(time);
        ctx.restore();
      }
      function frame(time) {
        const dt=Math.min(.033,Math.max(0,(time-lastTime)/1000||0));
        lastTime=time;
        if(state==='running') update(dt);
        if(level) draw(time);
        if(toastTime>0){toastTime-=dt;if(toastTime<=0)toast.hidden=true;}
        requestAnimationFrame(frame);
      }
      function bindHold(button,key) {
        const down=event=>{event.preventDefault();ensureAudio();input[key]=true;button.classList.add('is-down');button.setPointerCapture?.(event.pointerId);};
        const up=event=>{event.preventDefault();input[key]=false;button.classList.remove('is-down');};
        button.addEventListener('pointerdown',down);
        button.addEventListener('pointerup',up);
        button.addEventListener('pointercancel',up);
        button.addEventListener('lostpointercapture',up);
      }
      bindHold(buttons.left,'left');
      bindHold(buttons.right,'right');
      buttons.jump.addEventListener('pointerdown',event=>{event.preventDefault();ensureAudio();buttons.jump.classList.add('is-down');jump();});
      buttons.jump.addEventListener('pointerup',event=>{buttons.jump.classList.remove('is-down');if(event.detail>0)stage.focus({preventScroll:true});});
      buttons.jump.addEventListener('pointercancel',()=>buttons.jump.classList.remove('is-down'));
      buttons.jump.addEventListener('click',event=>{if(event.detail===0){ensureAudio();jump();}});
      buttons.hammer.addEventListener('pointerdown',event=>{event.preventDefault();ensureAudio();buttons.hammer.classList.add('is-down');hammer();});
      buttons.hammer.addEventListener('pointerup',event=>{buttons.hammer.classList.remove('is-down');if(event.detail>0)stage.focus({preventScroll:true});});
      buttons.hammer.addEventListener('pointercancel',()=>buttons.hammer.classList.remove('is-down'));
      buttons.hammer.addEventListener('click',event=>{if(event.detail===0){ensureAudio();hammer();}});
      startButton.addEventListener('click',()=>{
        if(state==='paused') togglePause(false);
        else startGame();
      });
      pauseButton.addEventListener('click',()=>togglePause());
      soundButton.addEventListener('click',()=>{
        toggleSound();
        if(state==='running') stage.focus({preventScroll:true});
      });
      fullscreenButton.addEventListener('click',()=>{
        toggleFullscreen();
        if(state==='running') stage.focus({preventScroll:true});
      });
      document.addEventListener('keydown',event=>{
        const interactiveTarget=event.target instanceof Element?event.target.closest('button,a,input,select,textarea'):null;
        if(interactiveTarget?.matches('input,select,textarea')||interactiveTarget&&[' ','Enter'].includes(event.key)) return;
        if(['ArrowLeft','ArrowRight','ArrowUp',' ','x','X','k','K'].includes(event.key)) event.preventDefault();
        if(event.key==='ArrowLeft'||event.key==='a'||event.key==='A') input.left=true;
        if(event.key==='ArrowRight'||event.key==='d'||event.key==='D') input.right=true;
        if(!event.repeat&&(event.key==='ArrowUp'||event.key==='w'||event.key==='W'||event.key===' ')) jump();
        if(!event.repeat&&(event.key==='x'||event.key==='X'||event.key==='k'||event.key==='K')) hammer();
        if(!event.repeat&&(event.key==='p'||event.key==='P'||event.key==='Escape')) togglePause();
        if(!event.repeat&&(event.key==='m'||event.key==='M')) toggleSound();
        if(!event.repeat&&(event.key==='f'||event.key==='F')) toggleFullscreen();
      });
      document.addEventListener('keyup',event=>{
        if(event.key==='ArrowLeft'||event.key==='a'||event.key==='A') input.left=false;
        if(event.key==='ArrowRight'||event.key==='d'||event.key==='D') input.right=false;
      });
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')togglePause(true);});
      document.addEventListener('fullscreenchange',()=>{
        fullscreenButton.textContent=document.fullscreenElement?'TAM EKRANDAN ÇIK':'TAM EKRAN';
        setTimeout(fit,50);
      });
      window.addEventListener('resize',fit,{passive:true});
      window.addEventListener('blur',()=>{input.left=false;input.right=false;});
      window.addEventListener('wheel',event=>{
        if(window.top!==window&&!document.fullscreenElement&&Math.abs(event.deltaY)>1) {
          window.parent.postMessage({type:'masalnova:embedded-game-scroll',deltaY:event.deltaY},location.origin);
        }
      },{passive:true});

      level=cloneLevel(0);
      const savedProgress=highestLevel>=levelBlueprints.length?' · 3 DİYAR TAMAMLANDI':highestLevel>0?' · DEVAM: '+levelBlueprints[highestLevel].name.toLocaleUpperCase('tr-TR'):'';
      bestLabel.textContent='EN İYİ PUAN · '+best+savedProgress;
      if(highestLevel>0&&highestLevel<levelBlueprints.length) startButton.textContent='DEVAM ET · '+levelBlueprints[highestLevel].name.toLocaleUpperCase('tr-TR');
      else if(highestLevel>=levelBlueprints.length) startButton.textContent='YENİDEN OYNA';
      fit();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
