<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Uçan Tohumlar oyun kapağı</title>
  <desc id="desc">Anadolu köyü önünde sapanla saksılara uçan tohumlar ve açan renkli çiçekler</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dc6ec"/>
      <stop offset=".72" stop-color="#d8f2e6"/>
      <stop offset="1" stop-color="#f6d98f"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8950"/>
      <stop offset="1" stop-color="#7d472b"/>
