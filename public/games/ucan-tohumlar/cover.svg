    <radialGradient id="seed" cx="34%" cy="25%" r="72%">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset=".48" stop-color="#e9a845"/>
      <stop offset="1" stop-color="#92502a"/>
